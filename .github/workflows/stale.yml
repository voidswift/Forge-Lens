name: Manage Stale Issues and PRs
on:
  schedule:
    - cron: '0 9 * * *' # Runs daily

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v8
        with:
          days-before-issue-stale: 14
          days-before-issue-close: -1
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-message: 'This issue has been inactive for 14 days. It has been marked stale and its assignee removed so others can pick it up.'
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'do-not-merge'
          remove-issue-stale-when-updated: true
          remove-pr-stale-when-updated: true
          remove-issue-assignees-when-stale: true
