name: Enforce PR Evidence
on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]

jobs:
  enforce-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'packages/github/**'
              - 'apps/web/src/inngest/**'
              - 'packages/db/src/**'
      - name: Check PR Body for Evidence
        if: contains(github.event.pull_request.labels.*.name, 'perf') || steps.changed.outputs.relevant == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || '').replace(/\r\n/g, '\n');
            const emptyMetrics = /TTFV:\s*Memory:\s*Latency:\s*(?:Error rate:\s*)?(?:Queue delay:\s*)?(?:$|\n)/m;
            const missingBefore = emptyMetrics.test(body);
            const missingAfter = body.includes('New numbers:') && emptyMetrics.test(body);
            if (missingBefore || missingAfter) {
              core.setFailed('Performance changes must include benchmark evidence in the PR body.');
            }
